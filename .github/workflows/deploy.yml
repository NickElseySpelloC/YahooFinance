name: Deploy YahooFinance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - MacMiniIT
          - MacMiniAU
          - both

jobs:
  deploy:
    name: Deploy → ${{ matrix.environment }}
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'both' && '["MacMiniIT","MacMiniAU"]' || format('["{0}"]', inputs.environment)) }}
    steps:
      - name: Pull latest from GitHub
        run: git -C /home/nick/scripts/YahooFinance pull

      - name: Restart service
        run: sudo systemctl restart YahooFinance

      - name: Verify service is running
        run: |
          sleep 6
          systemctl is-active YahooFinance