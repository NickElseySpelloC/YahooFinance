[project]
name = "YahooFinance"
version = "1.2.0"
description = "A simply wrapper around the yfinance libraries, making  it easy to download selected Yahoo symbols for a selected time period."
readme = "README.md"
requires-python = ">=3.13"
launch_path="src/main.py"
dependencies = [
    "cerberus>=1.3.7",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "sc-foundation-services>=3.0.3",
    "yfinance>=0.2.61",
]


[dev.env.sync]
remote="~/Library/CloudStorage/Dropbox/Development/dev_setup/app_config/YahooFinance"
patterns = [
    "data/*.csv"
]
